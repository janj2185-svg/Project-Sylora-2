name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: lint-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylora_phase1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylora_phase1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          DATABASE_URL: ''
          REDIS_URL: ''

      - name: PostgreSQL migrations and critical path
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sylora_phase1_test
