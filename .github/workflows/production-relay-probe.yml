name: Production relay probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-relay-probe
  cancel-in-progress: false

jobs:
  probe:
    name: read-only shell and relay-only media
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production read-only shell
        run: npm run test:e2e:production
        env:
          SYLORA_E2E_BASE_URL: https://getsylora.com
          SYLORA_E2E_SECURE_PROBE: '1'

      - name: Production relay-only media
        env:
          SYLORA_E2E_BASE_URL: https://getsylora.com
          SYLORA_E2E_AUTH_TOKEN: ${{ secrets.SYLORA_E2E_AUTH_TOKEN }}
          SYLORA_E2E_SECURE_PROBE: '1'
        run: |
          if [ -z "$SYLORA_E2E_AUTH_TOKEN" ]; then
            echo "::error::Configure the SYLORA_E2E_AUTH_TOKEN Actions secret with a revocable production session."
            exit 1
          fi
          npm run test:e2e:production:relay
