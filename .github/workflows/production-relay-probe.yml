name: Production relay probe

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character production commit SHA
        required: true
        type: string
      probe_identity:
        description: Dedicated production probe username or email
        required: true
        default: kvasnytsiaivan
        type: string

permissions:
  contents: read

concurrency:
  group: production-relay-probe
  cancel-in-progress: false

jobs:
  probe:
    name: read-only shell and relay-only media
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact production release identity
        run: node scripts/verify-release.mjs https://getsylora.com "$EXPECTED_SHA" 30
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production read-only shell
        run: npm run test:e2e:production
        env:
          SYLORA_E2E_BASE_URL: https://getsylora.com
          SYLORA_E2E_SECURE_PROBE: '1'

      - name: Production relay-only media
        env:
          SYLORA_E2E_BASE_URL: https://getsylora.com
          SYLORA_E2E_AUTH_TOKEN: ${{ secrets.SYLORA_E2E_AUTH_TOKEN }}
          SYLORA_E2E_AUTH_IDENTITY: ${{ inputs.probe_identity }}
          SYLORA_E2E_AUTH_PASSWORD: ${{ secrets.SYLORA_E2E_AUTH_PASSWORD }}
          SYLORA_E2E_SECURE_PROBE: '1'
        run: |
          if [ -z "$SYLORA_E2E_AUTH_TOKEN" ] && [ -z "$SYLORA_E2E_AUTH_PASSWORD" ]; then
            echo "::error::Configure SYLORA_E2E_AUTH_TOKEN or the dedicated SYLORA_E2E_AUTH_PASSWORD Actions secret."
            exit 1
          fi
          npm run test:e2e:production:relay
