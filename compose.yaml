services:
  sylora:
    restart: unless-stopped
    build: .
    ports: ["127.0.0.1:8787:8787"]
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: 8787
      NODE_ENV: production
      SYLORA_DATA_FILE: /app/data/sylora.json
      DATABASE_URL: postgresql://sylora:${POSTGRES_PASSWORD:-sylora_dev_only}@postgres:5432/sylora
      REDIS_URL: redis://redis:6379
      SYLORA_RELEASE_SHA: ${SYLORA_RELEASE_SHA:-unknown}
      SYLORA_RELEASE_REF: ${SYLORA_RELEASE_REF:-unknown}
      SYLORA_RELEASED_AT: ${SYLORA_RELEASED_AT:-}
      SYLORA_TRUSTED_PROXY_HOPS: 1
    command: ["sh", "-c", "node scripts/migrate.mjs && node src/server.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sylora-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sylora
      POSTGRES_USER: sylora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sylora_dev_only}
    volumes:
      - sylora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylora -d sylora"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sylora-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  turn:
    restart: unless-stopped
    profiles: ["turn"]
    image: coturn/coturn:4.17.2-r0
    network_mode: host
    # Deliberately pass only TURN-specific values. Do not expose the
    # application's database, OpenAI, payment, or other .env.local values.
    environment:
      SYLORA_TURN_SHARED_SECRET: ${SYLORA_TURN_SHARED_SECRET:-}
      SYLORA_TURN_EXTERNAL_IP: ${SYLORA_TURN_EXTERNAL_IP:-}
      SYLORA_TURN_RELAY_IP: ${SYLORA_TURN_RELAY_IP:-}
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver-base.conf:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$${#SYLORA_TURN_SHARED_SECRET}" -lt 32 ] || [ "$${#SYLORA_TURN_SHARED_SECRET}" -gt 512 ]; then
          echo "SYLORA_TURN_SHARED_SECRET must contain 32 to 512 characters" >&2
          exit 1
        fi
        case "$$SYLORA_TURN_SHARED_SECRET" in
          *[!A-Za-z0-9._~+/=-]*)
            echo "SYLORA_TURN_SHARED_SECRET contains unsupported characters" >&2
            exit 1
            ;;
        esac
        valid_ipv4() {
          value="$$1"
          case "$$value" in
            ''|*[!0-9.]*|.*|*..*|*.) return 1 ;;
          esac
          old_ifs="$$IFS"
          IFS=.
          set -- $$value
          IFS="$$old_ifs"
          [ "$$#" -eq 4 ] || return 1
          for octet in "$$@"; do
            [ "$$octet" -le 255 ] || return 1
          done
        }
        external_ip="$${SYLORA_TURN_EXTERNAL_IP:-}"
        relay_ip="$${SYLORA_TURN_RELAY_IP:-}"
        if [ -n "$$external_ip" ] || [ -n "$$relay_ip" ]; then
          if [ -z "$$external_ip" ] || [ -z "$$relay_ip" ]; then
            echo "SYLORA_TURN_EXTERNAL_IP and SYLORA_TURN_RELAY_IP must be set together" >&2
            exit 1
          fi
          if ! valid_ipv4 "$$external_ip" || ! valid_ipv4 "$$relay_ip"; then
            echo "SYLORA_TURN_EXTERNAL_IP and SYLORA_TURN_RELAY_IP must be valid IPv4 addresses" >&2
            exit 1
          fi
        fi
        umask 077
        cp /etc/coturn/turnserver-base.conf /tmp/turnserver.conf
        printf '\nstatic-auth-secret=%s\n' "$$SYLORA_TURN_SHARED_SECRET" >> /tmp/turnserver.conf
        if [ -n "$$external_ip" ]; then
          printf 'relay-ip=%s\nexternal-ip=%s/%s\n' "$$relay_ip" "$$external_ip" "$$relay_ip" >> /tmp/turnserver.conf
        fi
        unset SYLORA_TURN_SHARED_SECRET SYLORA_TURN_EXTERNAL_IP SYLORA_TURN_RELAY_IP
        exec turnserver -c /tmp/turnserver.conf
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  mediamtx:
    restart: unless-stopped
    profiles: ["streaming"]
    image: bluenviron/mediamtx:1.20.1
    environment:
      MTX_RTMPENCRYPTION: ${SYLORA_RTMP_ENCRYPTION:-no}
      MTX_RTMPSERVERKEY: /certs/server.key
      MTX_RTMPSERVERCERT: /certs/server.crt
      MTX_AUTHINTERNALUSERS_1_USER: "${SYLORA_MEDIA_ROUTER_CONTROL_USER:-sha256:kGQUYzJ4a/CKVC41DJisYR5X+oe1xJhu4l3tGnV7DTU=}"
      MTX_AUTHINTERNALUSERS_1_PASS: "${SYLORA_MEDIA_ROUTER_CONTROL_PASSWORD:-sha256:Cj9IXdbYwAUBYmqIp73ni4sEUE5Kwq1/uxo2wFOVW78=}"
    ports:
      - "${SYLORA_RTMP_BIND_ADDRESS:-127.0.0.1}:${SYLORA_RTMP_PORT:-1935}:1935"
      - "${SYLORA_RTMP_BIND_ADDRESS:-127.0.0.1}:${SYLORA_RTMPS_PORT:-1936}:1936"
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${SYLORA_RTMP_TLS_CERT_DIR:-./infra/mediamtx/dev-certs}:/certs:ro
      - sylora-live-recordings:/recordings
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  sylora-data:
  sylora-postgres:
  sylora-redis:
  sylora-live-recordings:
