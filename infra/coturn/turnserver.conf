# Base coturn configuration for SYLORA production.
# The Compose entrypoint appends static-auth-secret from .env.local to a
# rootless, container-local /tmp file. Never commit the shared secret here.

listening-port=3478
listening-ip=0.0.0.0
min-port=49160
max-port=49259

fingerprint
use-auth-secret
realm=getsylora.com
server-name=getsylora.com

# Bound early-production resource use and unauthenticated UDP challenge traffic.
user-quota=8
total-quota=80
unauthorized-ratelimit
unauthorized-ratelimit-rps=10
max-allocate-lifetime=3600
stale-nonce=600

# Plain TURN on UDP/TCP 3478. DTLS is off by default in coturn 4.17;
# TLS requires a dedicated certificate/DNS deployment and is intentionally off.
no-tls

# Do not let a public relay reach private/link-local/multicast IPv4 networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

no-software-attribute
log-file=stdout
log-min-level=info
pidfile=/tmp/turnserver.pid
