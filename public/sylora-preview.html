<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYLORA Digital Human Preview</title>
  <link rel="stylesheet" href="/design-living-horizon.css" />
  <link rel="stylesheet" href="/design-sylora-human-v7.css" />
  <style>
    body{margin:0;font:15px/1.4 "Segoe UI",sans-serif;background:#f7f1e8;color:#3a2f33;padding:24px}
    h1{font-size:20px;margin:0 0 8px}
    .row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
    .stage{position:relative;width:min(360px,92vw);aspect-ratio:3/4;background:#fffaf2;border-radius:28px;border:1px solid rgba(0,0,0,.06);box-shadow:0 18px 50px rgba(120,88,91,.12);overflow:hidden}
    .sylora-ai-hero{position:absolute;inset:0;margin:0;padding:0;min-height:0!important}
    .sylora-ai-hero.realtime-live{min-height:0!important;padding:0!important}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    button{border:0;border-radius:999px;padding:8px 14px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}
    button.active{background:#3a2f33;color:#fff}
    .note{max-width:520px;opacity:.8}
  </style>
</head>
<body>
  <h1>SYLORA Digital Human Preview</h1>
  <p class="note">Visual calibration for torso + shoulder → elbow → wrist chain. Gesture and presence controls drive the same motion rig as production AI.</p>
  <div class="controls" id="controls"></div>
  <div class="row">
    <section class="stage">
      <div class="sylora-ai-hero realtime-live" data-presence="ready" data-emotion="neutral" data-gesture="neutral" data-hand-pose="neutral"></div>
    </section>
  </div>
  <script type="module" src="/sylora-preview-init.js"></script>
</body>
</html>
